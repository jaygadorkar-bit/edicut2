services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edicut-web
    restart: "no"
    working_dir: /app
    # Uses the live database and Cloudinary configuration for local development.
    env_file:
      - .env.cloudflare
    environment:
      NODE_ENV: development
      CI: "true"
      DEBUG_MODE: "true"
      APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000/api/auth
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Production reCAPTCHA keys are domain-bound to edicut.com and reject localhost.
      # Keep the local profile usable while production remains protected by reCAPTCHA.
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      RECAPTCHA_SECRET_KEY: ""
      SESSION_SECRET: ${SESSION_SECRET:-stage9-local-session-secret-stage9-local-session}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -c "pnpm install --frozen-lockfile --prefer-offline --store-dir /pnpm/store &&
      pnpm --filter @edicut/shared build &&
      pnpm --filter @edicut/db build &&
      pnpm --filter @edicut/web exec react-router dev --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - edicut_web_node_modules:/app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/db/node_modules
      - /app/packages/platform-core/node_modules
      - /app/packages/shared/node_modules
      - edicut_web_pnpm_store:/pnpm/store

volumes:
  edicut_web_node_modules:
  edicut_web_pnpm_store:
