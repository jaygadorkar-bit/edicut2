services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edicut-web
    init: true
    restart: "no"
    working_dir: /app
    # Uses Neon for account/billing authorization and the live D1 chat database.
    # The management token stays server-side in this local development container.
    env_file:
      - .env.cloudflare
    environment:
      NODE_ENV: development
      CI: "true"
      DEBUG_MODE: "true"
      CHAT_BACKEND: d1
      CHAT_D1_REMOTE: "true"
      CHAT_D1_DATABASE_ID: "248da0e0-8360-4d6d-9d06-83e1504f332f"
      CLOUDFLARE_ACCOUNT_ID: "f2c46bb116722bcb7dc4be44e500154b"
      CLOUDFLARE_CHAT_DEV_API_TOKEN: ${CLOUDFLARE_MASTER_API_TOKEN:?Set CLOUDFLARE_MASTER_API_TOKEN in the local .env}
      APP_URL: http://localhost:3002
      AUTH_URL: http://localhost:3002/api/auth
      NEXT_PUBLIC_APP_URL: http://localhost:3002
      AUTH_GOOGLE_REDIRECT_URI: http://localhost:3002/api/auth/callback/google
      # Google's public v2 test pair is for this localhost-only development profile.
      # Production retains its domain-bound keys from the deployment environment.
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
      RECAPTCHA_SECRET_KEY: "6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe"
      SESSION_SECRET: ${SESSION_SECRET:-stage9-local-session-secret-stage9-local-session}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      DEV_CACHE_DIR: /var/cache/edicut/vite
    command:
      - sh
      - -c
      - node scripts/docker-dev.mjs && exec pnpm --filter @edicut/web exec react-router dev --host 0.0.0.0 --port 3002
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      start_interval: 3s
      retries: 3
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - .:/app
      - edicut_web_node_modules:/app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/node-api/node_modules
      - /app/packages/db/node_modules
      - /app/packages/platform-core/node_modules
      - /app/packages/shared/node_modules
      - edicut_web_pnpm_store:/pnpm/store
      - edicut_web_dev_cache:/var/cache/edicut

volumes:
  edicut_web_node_modules:
  edicut_web_pnpm_store:
  edicut_web_dev_cache:
