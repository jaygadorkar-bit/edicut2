server {
  listen 80;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # Path-based split:
  # - Vercel owns the API surface and future heavy handlers.
  # - Cloudflare owns page rendering and the edge shell.
  #
  # Note: current Next.js server actions still post to page endpoints and are
  # not split by this proxy yet. Those need to be migrated to explicit APIs.
  location /api/ {
    proxy_pass http://vercel-app:3000;
  }

  location / {
    proxy_pass http://cf-app:3000;
  }
}
